<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Busywork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Lato:wght@400;700&family=Oswald:wght@600&family=Roboto:wght@400;500;700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: a quiet chooser (setup) that opens full-bleed simulated workspaces.
   The setup screen follows the viewer's theme; each workspace commits to its own look. */
:root {
  --paper: #eff1ec; --card: #fafbf8; --ink: #1b2026; --muted: #59626b; --line: #d3d8d0;
  --mark: #f0d64f; --focus: #2b59d6; --btn: #1b2026; --btn-ink: #f6f7f3;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-g: Roboto, Arial, Arimo, Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #131619; --card: #1a1e22; --ink: #e6e8e3; --muted: #9aa3ab; --line: #2c3238; --mark: #8a781b; --focus: #8fb0ff; --btn: #e6e8e3; --btn-ink: #131619; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #131619; --card: #1a1e22; --ink: #e6e8e3; --muted: #9aa3ab; --line: #2c3238; --mark: #8a781b; --focus: #8fb0ff; --btn: #e6e8e3; --btn-ink: #131619; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); margin: 0; }
#app { height: 100%; }
#kb { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; resize: none; pointer-events: none; }
button { font: inherit; color: inherit; }
.ic { display: block; flex: none; }

/* ============================ setup ============================ */
#setup { min-height: 100%; font-family: var(--f-ui); background: var(--paper); color: var(--ink); padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.su { max-width: 1180px; margin: 0 auto; }
.su-top { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.su-mark { font-family: var(--f-mono); font-weight: 600; font-size: 26px; letter-spacing: -0.02em; }
.su-mark span { background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); padding: 0 2px; }
.su-tag { margin: 0; color: var(--muted); font-size: 15px; max-width: 60ch; }
.su-grid { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 32px; align-items: start; }
.su-pick { display: grid; gap: 20px; }
.su fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.su-lbl { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; padding: 0; }
.su-list { display: grid; gap: 8px; }
.su-card { position: relative; display: grid; grid-template-columns: 1fr; gap: 1px; padding: 9px 14px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
.su-card:hover { border-color: var(--muted); }
.su-card input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.su-card:has(input:checked) { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.su-card:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.su-cn { font-weight: 600; font-size: 15px; }
.su-cd { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
.su-cm { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.su-cm b { color: var(--ink); font-weight: 500; }
.su-ws { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.su-pl { margin-top: 20px; }
@media (max-width: 640px) { .su-ws { grid-template-columns: minmax(0, 1fr); } }
.su-wcard { padding: 10px 12px; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
.su-wcard .su-wi { grid-row: span 2; }
.su-wcard .su-wi img { max-width: 40px; max-height: 34px; object-fit: contain; }
.su-wcard .su-cd { font-size: 12.5px; }
.su-prev { position: sticky; top: 16px; min-width: 0; }
.su-frame { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 1px 0 var(--line), 0 12px 32px -18px rgba(20, 30, 40, .35); }
.su-scale { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; pointer-events: none; }
.su-scale > .ws { width: 1280px; height: 800px; }
.su-bar { display: flex; align-items: center; gap: 16px; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; }
.su-cap { font-size: 15px; }
.su-cap span { display: block; font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
.su-open { background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 6px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
.su-open:hover { opacity: .9; }
.su-open:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.su-notes { margin: 18px 0 0; padding: 14px 0 0 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; line-height: 1.5; display: grid; gap: 6px; }
.su-notes b { color: var(--ink); font-weight: 500; }
kbd { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--card); color: var(--ink); }
@media (max-width: 900px) { .su-grid { grid-template-columns: minmax(0, 1fr); } .su-prev { position: static; } }

/* ============================ workspaces: shared ============================ */
.ws { position: relative; height: 100%; overflow: hidden; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
#ws[hidden] { display: none; }
.ws .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 500 15px var(--f-g); flex: none; }
.ws .avatar.sm { width: 28px; height: 28px; font-size: 13px; }
.caret { display: inline-block; width: 2px; height: 1.15em; margin-right: -2px; background: #000; vertical-align: -0.2em; animation: bw-blink 1.06s steps(1) infinite; position: relative; z-index: 1; }
@keyframes bw-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
.is-preview .caret { animation: none; }
.ph { color: #80868b; }
.x-ghost { color: #6f757b; }
.x-err { color: #c5221f; text-decoration: underline wavy #d93025; text-decoration-skip-ink: none; text-underline-offset: 3px; }
.x-sp { background: rgba(217, 48, 37, .16); }
.x-b { font-weight: 700; }
.x-i { font-style: italic; }
.x-dim { color: #80868b; }
.x-miss { color: #9aa0a6; }
.x-extra { color: #8c1d18; }
.x-go { color: #0b57d0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.x-go:hover { color: #0842a0; }
.s-grid td.x-go { text-decoration: none; }
.x-opt { cursor: pointer; color: #80868b; border-radius: 3px; padding: 0 1px; -webkit-user-select: none; user-select: none; }
.x-opt:hover { color: #1f1f1f; text-decoration: underline; text-underline-offset: 2px; }
.x-opt.x-on { color: #0b57d0; font-weight: 700; }
.x-opt.x-on:hover { text-decoration: none; }
.d-content .d-p.x-cfg { text-indent: 0; font: 12.5px/1.6 Roboto, Arial, Arimo, sans-serif; margin: 4px 0 8px; }
.sc-a.x-cfg { margin-bottom: 10px; font-size: 13px; line-height: 1.6; }
.s-grid td.x-cfg { font-size: 12px; }
.x-mono { font-family: "Courier Prime", "Courier New", Courier, monospace; letter-spacing: .04em; }
.x-mk-ok { background: #d9ead3; font-weight: 700; }
.x-mk-near { background: #fff2cc; font-weight: 700; }
.x-mk-miss { background: #efefef; color: #666; }
.x-sel { background: #c9daf8; }
.x-hl1, .x-lvl1 { background: #fff2cc; } .x-hl2, .x-lvl2 { background: #d9ead3; } .x-hl3, .x-lvl3 { background: #cfe2f3; } .x-hl4, .x-lvl4 { background: #d9d2e9; }
.sym { font-size: .7em; font-weight: 400; color: #444; margin-left: 3px; position: relative; top: -.45em; }
.snack { position: absolute; left: 50%; bottom: 26px; transform: translate(-50%, 16px); opacity: 0; background: #303030; color: #f1f1f1; font: 14px/20px var(--f-g); padding: 12px 18px; border-radius: 4px; transition: opacity .18s, transform .18s; pointer-events: none; z-index: 40; max-width: min(560px, 86%); box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px rgba(0,0,0,.14); }
.snack.show { opacity: 1; transform: translate(-50%, 0); }

/* comment cards (document + spreadsheet) */
.cm { position: absolute; left: 0; width: 260px; box-sizing: border-box; background: #fff; border-radius: 8px; padding: 12px 14px 12px; color: #1f1f1f; font: 14px/20px var(--f-g); box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); text-align: left; }
.cm.pulse { box-shadow: 0 0 0 2px #0b57d0, 0 2px 6px 2px rgba(60,64,67,.15); }
.cm-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.cm-who { flex: 1; min-width: 0; }
.cm-nm { font-weight: 500; font-size: 14px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-tm { font-size: 12px; color: #5f6368; line-height: 16px; }
.cm-ic { color: #444746; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
.cm-sub { font-size: 12px; color: #5f6368; margin-bottom: 2px; }
.cm-body { font-size: 14px; }
.cm-foot { font-size: 12.5px; color: #5f6368; margin-top: 6px; }
.cm-rep { display: flex; gap: 8px; align-items: flex-start; border-top: 1px solid #e3e3e3; margin-top: 10px; padding-top: 10px; font-size: 13.5px; line-height: 19px; }
.cm-dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa0a6; margin-top: 6px; flex: none; }
.cm-rep.tone-ok .cm-dot { background: #188038; }
.cm-rep.tone-bad .cm-dot { background: #d93025; }
.cm-acts { display: flex; gap: 4px; justify-content: flex-end; margin-top: 8px; }
.cm-act { background: none; border: 0; color: #0b57d0; font: 500 14px var(--f-g); padding: 6px 12px; border-radius: 18px; cursor: pointer; }
.cm-act:hover { background: #e9eef6; }

/* ============================ document ============================ */
.ws-docs, .ws-sheets { background: #f9fbfd; color: #1f1f1f; font-family: var(--f-g); }
.d-head { display: flex; align-items: center; gap: 2px; height: 64px; padding: 0 16px 0 12px; box-sizing: border-box; flex: none; }
.d-logo { width: 40px; height: 40px; display: grid; place-items: center; margin-right: 4px; flex: none; }
.d-logo svg { width: 26px; height: 34px; }
.d-hmid { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding-top: 2px; }
.d-trow { display: flex; align-items: center; height: 28px; min-width: 0; }
.d-title { font: 18px/26px var(--f-g); color: #1f1f1f; padding: 0 6px; margin-left: -1px; border: 1px solid transparent; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.d-title:hover { border-color: #747775; }
.d-hic { display: flex; align-items: center; gap: 0; margin-left: 2px; flex: none; }
.d-ib { width: 28px; height: 28px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: #444746; cursor: pointer; flex: none; padding: 0; }
.d-ib:hover { background: rgba(68,71,70,.08); }
.d-ib.on { color: #f9ab00; }
.d-ib.d-lg { width: 40px; height: 40px; }
.d-ib.d-sm { width: 28px; height: 28px; }
.d-menus { display: flex; overflow-x: auto; scrollbar-width: none; margin-left: -1px; }
.d-menu { background: none; border: 0; padding: 0 7px; height: 24px; border-radius: 4px; font: 14px/24px var(--f-g); letter-spacing: .1px; color: #1f1f1f; cursor: pointer; white-space: nowrap; }
.d-menu:hover, .d-menu.open { background: #e2e6eb; }
.d-hright { display: flex; align-items: center; gap: 4px; flex: none; }
.d-share { display: flex; align-items: stretch; height: 40px; border-radius: 20px; overflow: hidden; background: #c2e7ff; margin: 0 10px 0 6px; }
.d-share button { border: 0; background: none; color: #001d35; cursor: pointer; display: flex; align-items: center; font: 500 14px/20px var(--f-g); letter-spacing: .1px; }
.d-sh-b { gap: 8px; padding: 0 16px 0 14px; }
.d-sh-c { padding: 0 9px 0 7px; box-shadow: inset 1px 0 0 #f9fbfd; }
.d-share button:hover { background: rgba(0,29,53,.08); }
.d-tb { display: flex; align-items: center; height: 40px; margin: 0 16px 8px; padding: 0 8px; background: #edf2fa; border-radius: 24px; flex: none; min-width: 0; }
.d-tbi { display: flex; align-items: center; gap: 0; flex: 1; min-width: 0; overflow: hidden; }
.d-tbr { display: flex; align-items: center; gap: 0; flex: none; margin-left: 8px; }
.tb { height: 24px; min-width: 24px; margin: 0 1px; padding: 0 3px; border: 0; background: none; border-radius: 4px; color: #444746; display: inline-flex; align-items: center; justify-content: center; gap: 0; cursor: pointer; font: 14px/24px var(--f-g); flex: none; box-sizing: border-box; }
.tb:hover { background: #dfe4ea; }
.tb.on { background: #d3e3fd; color: #0b57d0; }
.tb-icdd { padding: 0 0 0 3px; }
.tb-icdd .mi + .mi { margin-left: -3px; }
.tb-dd { padding: 0 0 0 6px; justify-content: space-between; color: #444746; }
.tb-dd .tb-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.tb-zoom { width: 64px; }
.tb-style { width: 116px; }
.tb-font { width: 100px; }
.tbx { font: 500 13px/24px var(--f-g); padding: 0 4px; }
.tbx sub { font-size: 9px; vertical-align: -2px; margin-left: 1px; }
.d-fsz { width: 32px; height: 24px; margin: 0 2px; border: 1px solid #747775; border-radius: 4px; display: grid; place-items: center; font: 14px var(--f-g); color: #1f1f1f; box-sizing: border-box; flex: none; }
.sep { width: 1px; height: 20px; background: #c7c7c7; margin: 0 4px; flex: none; }
.d-srch { display: flex; align-items: center; gap: 6px; height: 30px; width: 96px; padding: 0 10px 0 8px; margin: 0 8px 0 -2px; border: 0; border-radius: 15px; background: #fff; color: #444746; font: 14px/20px var(--f-g); cursor: text; flex: none; box-sizing: border-box; }
.d-srch:hover { background: #f8fafd; }
.d-mode { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 140px; height: 28px; padding: 0 2px 0 8px; border: 0; border-radius: 4px; background: none; color: #444746; font: 500 14px/20px var(--f-g); cursor: pointer; }
.d-mode span { flex: 1; text-align: left; }
.d-mode:hover { background: #dfe4ea; }
.d-rrow { display: flex; height: 23px; flex: none; border-bottom: 1px solid #e0e4ea; }
.d-rsp { flex: none; }
.d-rc { flex: 1; display: flex; justify-content: center; overflow: hidden; gap: 16px; box-sizing: border-box; }
.d-ruler { width: 816px; flex: none; }
.d-rcs { flex: none; }
.d-body { flex: 1; display: flex; min-height: 0; position: relative; }
.d-outline { width: 260px; flex: none; padding: 6px 12px 80px 20px; box-sizing: border-box; overflow-y: auto; }
.ol-closed .d-outline { width: 0; padding: 0; overflow: visible; }
.ol-closed .d-ol-h, .ol-closed .d-tab, .ol-closed .d-ol-list { display: none; }
.ol-closed .d-ol-top { position: absolute; left: 12px; top: 8px; z-index: 5; margin: 0; }
.d-ol-top { margin: 6px 0 12px -4px; }
.d-ol-h { display: flex; align-items: center; justify-content: space-between; font: 500 14px var(--f-g); color: #1f1f1f; padding: 4px 0 10px 4px; }
.d-tab { display: flex; align-items: center; gap: 12px; height: 40px; border-radius: 20px; padding: 0 6px 0 16px; background: #d3e3fd; color: #0b57d0; font: 500 14px var(--f-g); }
.d-tab span:nth-child(2) { flex: 1; }
.d-tab-i { display: grid; place-items: center; }
.d-tab .d-ib { color: #0b57d0; }
.d-ol-list { display: flex; flex-direction: column; margin: 8px 0 0 22px; border-left: 2px solid #e3e3e3; }
.d-ol-i { text-align: left; background: none; border: 0; font: 14px/18px var(--f-g); color: #444746; padding: 9px 10px 9px 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-ol-i.sub { padding-left: 24px; }
.d-ol-i:hover { color: #0b57d0; }
.d-scroll { flex: 1; overflow: auto; position: relative; min-width: 0; }
.d-canvas { display: flex; justify-content: center; gap: 16px; padding: 14px 24px 120px; position: relative; min-width: min-content; }
.d-page { width: 816px; min-height: 1056px; box-sizing: border-box; padding: 96px; background: #fff; box-shadow: 0 1px 3px 1px rgba(60,64,67,.15), 0 1px 2px rgba(60,64,67,.15); position: relative; flex: none; }
.d-comments { position: relative; width: 260px; flex: none; }
.cm-inline .d-comments { display: none; }
.cm.inline { position: relative; width: auto; max-width: 440px; margin: 2px 0 16px; font-family: var(--f-g); }
.narrow .d-canvas { padding: 8px 8px 100px; min-width: 0; }
.narrow .d-page { width: 100%; padding: 40px 26px; min-height: 0; }
.narrow .d-rrow { display: none; }
.d-content { font-family: Arial, Arimo, Helvetica, sans-serif; font-size: 14.667px; line-height: 1.45; color: #000; }
.d-content.f-serif { font-family: "Times New Roman", Tinos, Times, serif; font-size: 16px; }
.d-content.f-lato { font-family: Lato, Arial, sans-serif; }
.d-ttl { font-size: 2em; line-height: 1.2; margin: 4px 0 14px; text-wrap: balance; }
.f-serif .d-ttl { font-size: 1.6em; text-align: center; margin-top: 10px; }
.d-meta { font-size: .82em; color: #5f6368; margin: 0 0 6px; }
.d-h { font-size: 1.45em; font-weight: 400; line-height: 1.3; margin: 22px 0 8px; }
.d-p { margin: 0 0 12px; overflow-wrap: break-word; }
.f-serif .d-p { text-indent: .5in; line-height: 1.6; }
.f-serif .d-p.d-entry { text-indent: 0; }
.d-ul { margin: 0 0 12px; padding-left: 30px; }
.d-ul li { margin: 3px 0; }
.d-lbl.cmt-hl { background: #fce8b2; border-bottom: 2px solid #fbbc04; }
.d-tbl { border-collapse: collapse; width: 100%; table-layout: fixed; margin: 6px 0 16px; }
.d-tbl th, .d-tbl td { border: 1px solid #000; padding: 5px 7px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.d-tbl th { font-weight: 700; background: #f3f3f3; }
.d-tbl .ctr { text-align: center; }
.d-tbl.pick td { cursor: pointer; user-select: none; height: 2.2em; vertical-align: middle; }
.d-tbl.pick td:hover { background: #eef3fd; }
.d-tbl.pick td.x-sel { background: #c9daf8; }
.d-tbl td.x-cur { box-shadow: inset 0 0 0 2px #4a86e8; }
.d-tbl td.x-typed { background: #fff; font-weight: 700; }
.d-tbl td:empty::after { content: "\00a0"; }
.d-wc { position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 8px; padding: 7px 10px 7px 14px; font: 13px var(--f-g); color: #444746; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); z-index: 20; }
.d-wc .st-score { color: #1f1f1f; font-weight: 500; }
.d-dot { color: #9aa0a6; }
.d-wc .warn, .s-sum .warn { color: #d93025; }
.c-status .warn { color: #ff6b63; }

/* ============================ spreadsheet ============================ */
.s-share { margin-right: 8px; }
.s-fbar { display: flex; align-items: stretch; height: 28px; border-top: 1px solid #e1e3e1; border-bottom: 1px solid #e1e3e1; background: #fff; flex: none; }
.s-name { width: 96px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 10px; border-right: 1px solid #e1e3e1; font: 14px var(--f-g); color: #1f1f1f; box-sizing: border-box; }
.s-name .ic { color: #444746; margin-right: -4px; }
.s-fx { width: 34px; display: grid; place-items: center; font: italic 15px Georgia, serif; color: #80868b; border-right: 1px solid #e1e3e1; }

        { t: 'p', id: 'cfg', c: 'cfg', runs: cfg },
        { t: 'p', id: 'pass', runs, wt: 'input' },
        { t: 'note', anchor: 'pass', author: 'Peer reviewer', sub, text: 'Clean copy needed. ' + task + how, foot, replies, actions, wt: 'prompt' },
        { t: 'h', text: 'Revision history' },
        { t: 'table', id: 'hist', cols: ['Pass', 'Mode', 'Speed', 'Accuracy', 'Time'], rows: histRows, wt: 'feedback' }
      ]
    };
  },
  walk: {
    doc: ['The comment beside the paragraph is your task. The small line just above the text holds the test settings: time, words or quote mode, the length (or a custom one), punctuation, numbers, and where the words come from. Click any setting; the same options are in the Tools menu.', 'Just start typing; the clock waits for your first keystroke. Space jumps to the next word, Backspace fixes the current word, and Tab restarts with new text.', 'When the test ends, a reply under the comment gives your speed, accuracy and character counts, and the Revision history table keeps a log.'],
    script: ['The script note is your task. The small line above the dialogue holds the test settings: time, words or quote mode, the length (or a custom one), punctuation, numbers, and where the words come from. The same options are in the View menu.', 'Just start typing; the clock waits for your first keystroke. Space jumps to the next word, Backspace fixes the current word, and Tab restarts with new text.', "When the test ends, the note gives your speed, accuracy and character counts, and the stage manager's log keeps a record."],
    sheet: ['The comment on the notes cell is your task. The row just above the text holds the test settings: time, words or quote mode, the length (or a custom one), punctuation, numbers, and where the words come from. The same options are in the Tools menu.', 'Just start typing; the clock waits for your first keystroke. Space jumps to the next word, Backspace fixes the current word, and Tab restarts with new text. The formula bar shows the word you are on.', 'When the test ends, the comment gives your speed, accuracy and character counts, and the table below keeps a log.']
  },
  summary(s) { return s.hist && s.hist.length ? `Test ${s.round} · best ${s.best} wpm` : ''; }
};

/* ---------- 2. Rare answers ---------- */
const RARE_LIMIT = 25000, RARE_WARN = 5000;
/* Phases: 'ready' (category hidden, clock stopped, waiting for Start or
   Next category) and 'live' (category showing, 25-second clock running). */
GAMES.rare = {
  id: 'rare', name: 'Krillion', inspo: 'Category trivia that rewards rare answers',
  blurb: 'One answer per category, 25 seconds each, unlimited guesses. Rarer answers score more, each category hides exactly one One in a Krillion, and you start each category when you are ready.',
  menu: [{ id: 'go', label: 'Start next category' }, { id: 'skip', label: 'Skip this category' }, { id: 'next', label: 'New set of categories' }],
  init() { const s = { round: 1, score: 0, best: 0 }; this.newSet(s); return s; },
  newSet(s) {
    s.cats = []; for (let i = 0; i < 5; i++) s.cats.push(bagNext(s, 'bag', RARE_P.length));
    Object.assign(s, { i: 0, input: '', log: [], misses: [], roundPts: 0, done: false, ms: 0, qms: 0, warned: false, lastNote: null, phase: 'ready' });
  },
  /* saves from before the ready step resume with the category hidden */
  fix(s) { if (s.phase !== 'ready' && s.phase !== 'live') { s.phase = 'ready'; s.qms = 0; s.warned = false; } },
  live(s) { return !s.done && s.phase === 'live'; },
  begin(s) { Object.assign(s, { phase: 'live', qms: 0, warned: false, misses: [], input: '' }); },
  running(s) { this.fix(s); return this.live(s); },
  left(s) { return Math.max(0, RARE_LIMIT - (s.qms || 0)); },
  clockMs(s) { return s.done ? 0 : this.left(s); },
  tick(s, dt) {
    this.fix(s);
    if (!this.live(s)) return false;
    s.qms = (s.qms || 0) + dt;
    if (s.qms >= RARE_LIMIT) { this.timeout(s); return true; }
    if (!s.warned && RARE_LIMIT - s.qms <= RARE_WARN) { s.warned = true; flash(s, '5 seconds left', 'info', RARE_WARN); return true; }
    return false;
  },
  timeout(s) {
    const cat = RARE_P[s.cats[s.i]];
    s.log.push({ a: null, tier: 0, pts: 0, why: 'time' });
    s.lastNote = { text: `Time's up on “${cat.s}”. Accepted answers included ${this.examples(cat)}.`, tone: 'bad' };
    flash(s, "Time's up", 'bad');
    this.advance(s);
  },
  key(s, k) {
    this.fix(s);
    if (k.key === 'Enter') {
      if (k.repeat) return true;
      if (s.done) { s.round++; this.newSet(s); return true; }
      if (s.phase === 'ready') { this.begin(s); return true; }
      return this.submit(s);
    }
    if (!this.live(s)) return false;
    const v = editText(s.input, k, 60); if (v === null) return false; s.input = v; return true;
  },
  act(s, a) {
    this.fix(s);
    if (a === 'go') {
      if (s.done) { s.round++; this.newSet(s); return true; }
      if (s.phase === 'ready') { this.begin(s); return true; }
      return false;
    }
    if (a === 'skip' && this.live(s)) {
      const cat = RARE_P[s.cats[s.i]];
      s.log.push({ a: null, tier: 0, pts: 0, why: 'skip' });
      s.lastNote = { text: `Skipped “${cat.s}”. Accepted answers included ${this.examples(cat)}.`, tone: 'bad' };
      flash(s, 'Skipped', 'info');
      this.advance(s); return true;
    }
    if (a === 'next') { s.round++; this.newSet(s); return true; }
    return false;
  },
  /* never gives away the category's One in a Krillion answer */
  examples(cat) {
    const pick = t => { const o = cat.ans.filter(a => a.tier === t); return o.length ? o[Math.floor(Math.random() * o.length)].name : null; };
    return [pick(1) || pick(2), pick(3), pick(4)].filter(Boolean).join(', ');
  },
  submit(s) {
    const raw = s.input.trim(); if (!raw) return true;
    const cat = RARE_P[s.cats[s.i]], m = matchRare(cat, raw);
    s.input = '';
    if (m) {
      const hit = m.a, T = TIERS[hit.tier];
      s.log.push({ a: hit.name, tier: hit.tier, pts: T.pts });
      s.roundPts += T.pts; s.score += T.pts;
      const fixed = m.exact ? '' : ` (autocorrected from “${raw}”)`;
      let more;
      if (hit.tier === 5) more = ` That is this category's one and only One in a Krillion answer!`;
      else {
        const deeper = shuffle(cat.ans.filter(a => a.tier === 4 && a !== hit)).slice(0, 2).map(a => a.name);
        more = hit.tier < 4 && deeper.length ? ` Rarer picks: ${deeper.join(', ')}.` : ' Only the One in a Krillion answer scores higher.';
      }
      s.lastNote = { text: `${hit.name}${fixed}: ${T.label}, +${T.pts}.${more}`, tone: 'ok' };
      flash(s, hit.tier === 5 ? `${hit.name}: One in a Krillion! +${T.pts}` : `${hit.name}: ${T.label}, +${T.pts}`, 'ok');
      this.advance(s);
    } else {
      s.misses.push(raw);
      flash(s, `“${raw}” isn't on the key`, 'bad');
    }
    return true;
  },
  advance(s) {
    Object.assign(s, { i: s.i + 1, misses: [], qms: 0, warned: false, input: '', phase: 'ready' });
    if (s.i >= s.cats.length) {
      s.done = true; s.best = Math.max(s.best, s.roundPts);
      s.lastNote = { text: (s.lastNote ? s.lastNote.text + ' ' : '') + `Set ${s.round} total: ${s.roundPts} points.`, tone: s.lastNote ? s.lastNote.tone : 'ok' };
    }
  },
  replies(s) {
    if (!this.live(s)) return s.lastNote ? [s.lastNote] : [];
    const r = [], m = s.misses || [];
    if (m.length > 3) r.push({ text: `${m.length - 3} earlier ${plural(m.length - 3, 'guess', 'guesses')} didn't match.`, tone: 'bad' });
    return r.concat(m.slice(-3).map(x => ({ text: `“${x}” isn't on the key. Keep guessing.`, tone: 'bad' })));
  },
  status(s) {
    this.fix(s);
    const live = this.live(s), left = s.done ? 0 : Math.ceil(this.left(s) / 1000) * 1000;
    const where = s.done ? 'Set done' : live ? `Category ${s.i + 1} of 5` : s.i ? `Up next: ${s.i + 1} of 5` : 'Ready to start';
    return [{ k: 'score', v: s.score + ' pts' }, { k: 'left', v: where },
      { k: 'round', v: 'Set ' + s.round }, { k: 'time', v: clock(left), ms: left, warn: live && left <= RARE_WARN, force: true }];
  },
  missText(L) { return L.why === 'time' ? 'time ran out' : L.why === 'skip' ? 'skipped' : 'no match'; },
  rows(s, m) {
    const live = this.live(s);
    return s.cats.map((ci, idx) => {
      const c = RARE_P[ci], L = s.log[idx];
      if (L) return [String(idx + 1), c.s, L.a ? L.a : { v: this.missText(L), c: 'dim i' }, L.a ? TIERS[L.tier].label : '—', L.a ? '+' + L.pts : '0'];
      if (idx === s.i && live) return [String(idx + 1), { v: c.s, wt: m === 'sheet' ? 'prompt' : null }, m === 'sheet' ? { entry: true, v: s.input, ph: 'Type, then Enter', wt: 'input' } : { v: 'in progress', c: 'dim i' }, '', ''];
      if (idx === s.i && !s.done) return [String(idx + 1), { v: '—', c: 'dim' }, { v: 'up next', c: 'dim i' }, '', ''];
      return [String(idx + 1), { v: '—', c: 'dim' }, '', '', ''];
    });
  },
  view(s, m) {
    this.fix(s);
    const live = this.live(s), ready = !s.done && !live, first = s.i === 0;
    const cat = live ? RARE_P[s.cats[s.i]] : null, replies = this.replies(s);
    const goLabel = s.done ? 'New set' : first ? 'Start' : 'Next category';
    const sub = s.done ? 'Set complete' : live ? `Category ${s.i + 1} of 5` : `Category ${s.i + 1} of 5 · ready`;
    const foot = live ? '25 seconds per category · unlimited guesses' : s.done ? 'Press Enter for a new set' : 'Clock stopped · press Enter when ready';
    const actions = live ? [{ label: 'Skip', act: 'skip' }] : [{ label: goLabel, act: 'go' }];
    const readyText = first
      ? `Set ${s.round} is ready: five categories, 25 seconds each. Every category has exactly one One in a Krillion answer. The clock only runs while a category is showing.`
      : `Clock stopped. Take a break if you like, then start category ${s.i + 1} of 5.`;
    if (m === 'script') {
      const blocks = [
        { t: 'h', text: 'INT. CAMPUS LIBRARY - STUDY ROOM - NIGHT' },
        { t: 'p', text: 'Index cards are fanned across the table. PROFESSOR IDA VANCE (60s) turns them over one at a time, an egg timer ticking beside her. MAYA (17) has to name something nobody else in the seminar would think of.' },
        { t: 'say', who: 'VANCE', text: 'Twenty-five seconds a card. Common answers are worth almost nothing. One answer per card is worth everything. Surprise me.' }
      ];
      s.log.forEach((L, idx) => {
        blocks.push({ t: 'say', who: 'VANCE', text: RARE_P[s.cats[idx]].s + '.' });
        blocks.push({ t: 'say', who: 'MAYA', paren: L.a ? `${TIERS[L.tier].label}, +${L.pts}` : this.missText(L), text: L.a ? L.a + '.' : 'I have nothing. Next card.' });
      });
      if (live) {
        blocks.push({ t: 'say', id: 'q', who: 'VANCE', paren: `card ${s.i + 1} of 5`, text: cat.q, wt: 'prompt' });
        blocks.push({ t: 'entry', id: 'entry', who: 'MAYA', value: s.input, ph: 'type an answer, then press Enter', wt: 'input' });
      } else if (ready) {
        blocks.push({ t: 'p', text: first ? 'Vance taps the face-down deck and waits for Maya to settle in.' : 'Vance sets the card aside and lets Maya catch her breath. The egg timer sits still.', wt: 'prompt' });
        blocks.push({ t: 'p', id: 'entry', runs: [{ text: 'Press Enter or ', c: 'b' }, { text: `turn over card ${s.i + 1} of 5`, c: 'b go', act: 'go' }, { text: '.', c: 'b' }], wt: 'input' });
      } else {
        blocks.push({ t: 'p', text: `Vance squares the deck and writes ${s.roundPts} on the whiteboard.` });
        blocks.push({ t: 'p', id: 'entry', runs: [{ text: 'Press Enter or ', c: 'b' }, { text: 'deal a new set of cards', c: 'b go', act: 'go' }, { text: '.', c: 'b' }], wt: 'input' });

      { t: 'h', text: `Findings, set ${s.round}` },
      { t: 'table', id: 'find', cols: ['#', 'Category', 'Example', 'Rarity', 'Pts'], widths: [6, 34, 24, 25, 11], rows: this.rows(s, m), wt: 'feedback' },

  },
  walk: {

/* ---------- 3. Survey says ---------- */

  },

      const blocks = [

        { t: 'h', text: 'INT. PSYCHOLOGY LAB - OBSERVATION ROOM - DAY' },
        { t: 'p', text: 'A desk, a monitor, and a stopwatch. DR. OKAFOR (40s) runs a perception study. JULES (17), the paid subject, sits facing the screen.' },
        { t: 'say', who: 'DR. OKAFOR', text: s.done ? 'That is the full battery. Thank you.' : this.instr(s) },
        Object.assign(fig, { caption: 'THE MONITOR' })
      ];
      if (entry) blocks.push({ t: 'entry', id: 'entry', who: 'JULES', value: s.input, ph: 'type a number, then press Enter' });
      blocks.push({ t: 'p', text: 'Okafor makes a note on her clipboard.' });
      blocks.push(Object.assign(log, { caption: 'THE CLIPBOARD' }));
      blocks.push(note);
      return { title: 'Lab Rats - Draft 1', status: this.status(s), blocks };
    }
    if (m === 'sheet') {
      const blocks = [{ t: 'title', text: `Perception study - session ${s.round}` }, { t: 'meta', text: 'Scores use exp(-0.5 x (error / tolerance)^2) x 100' }, fig];
      if (entry) blocks.push({ t: 'table', id: 'entry', rows: [[{ v: 'Estimate', c: 'b' }, { entry: true, v: s.input, ph: 'Type, then Enter' }]] });
      blocks.push({ t: 'gap' }, log, Object.assign(note, { cell: [0, 4] }));
      return { title: 'Perception Study Data', sheetName: 'Session log', sheetCols: [60, 110, 170, 170, 90], status: this.status(s), blocks };
    }
    const blocks = [
      { t: 'meta', text: 'Psychology · Lab 4 · Perception and estimation' },
      { t: 'title', text: 'Lab Report: Perception Trials' },
      { t: 'p', text: 'Five short trials measure how accurately a person estimates quantity, motion, angle, rhythm, and proportion. Each response is compared with the true value, and the error is converted to a score from 0 to 100.' },
      { t: 'h', text: s.done ? 'All trials complete' : `Trial ${s.i + 1}: ${PC_NAME[T.kind]}` },
      fig
    ];
    if (entry) blocks.push({ t: 'entry', id: 'entry', label: 'Estimate:', value: s.input, ph: 'type a number, then press Enter' });
    blocks.push(note, { t: 'h', text: 'Results' }, log);
    return { title: 'Lab Report - Perception', font: 'sans', size: 11, status: this.status(s), blocks };
  },

/* ----------------------------- base ----------------------------- */
class SkinBase {
  constructor(root, host, opts) { this.root = root; this.host = host; this.opts = opts || {}; this.view = null; this.zoom = 100; }
  q(s) { return this.root.querySelector(s); }
  qa(s) { return [...this.root.querySelectorAll(s)]; }
  bind() {
    if (this.opts.preview) return;
    this._click = e => this.onClick(e);
    this.root.addEventListener('click', this._click);
    this.ro = new ResizeObserver(() => this.layout());
    this.ro.observe(this.root);
  }
  onClick(e) {
    if (e.target.closest('button')) setTimeout(() => { const f = document.activeElement; if (f && f.tagName === 'BUTTON' && this.root.contains(f)) f.blur(); });
    const a = e.target.closest('[data-act]');
    if (a && this.root.contains(a)) {
      const act = a.dataset.act;
      if (act.startsWith('ui:')) this.ui(act.slice(3), a); else this.host.act(act);
      return;
    }
    const m = e.target.closest('[data-menu]');
    if (m) { this.host.openMenu(m.dataset.menu, m); return; }
    const t = e.target.closest('[data-toggle]');
    if (t) { t.classList.toggle('on'); return; }
    const z = e.target.closest('[data-zoom]');
    if (z) { this.host.openList([50, 75, 90, 100, 125, 150].map(v => ({ label: v + '%', checked: v === this.zoom, act: () => this.setZoom(v) })), z); return; }
    if (this.onOther) this.onOther(e);
  }
  setZoom(v) { this.zoom = v; this.qa('[data-zoom] .zl').forEach(el => el.textContent = v + '%'); this.applyZoom(); this.layout(); }
  applyZoom() { }
  ui() { }
  layout() { }
  clearFlash() {
    const el = this.q('.snack'); if (!el) return;
    clearTimeout(this._ft); el.style.transition = 'none'; el.classList.remove('show'); void el.offsetWidth; el.style.transition = '';
  }
  flash(f) {
    const el = this.q('.snack'); if (!el) return;
    el.textContent = f.text; el.className = 'snack show tone-' + (f.tone || 'info');
    clearTimeout(this._ft); this._ft = setTimeout(() => el.classList.remove('show'), f.ms || 2600);
  }
  items(status) { return (status || []).filter(s => s.k !== 'time' || s.force || this.host.prefs().timer); }
  avatar() { const i = (this.host.prefs().initial || 'H').slice(0, 1).toUpperCase(); return `<div class="avatar" style="background:${avColor(i)}">${esc(i)}</div>`; }
  scrollCaret(sc) {
    const c = this.q('.caret') || this.q('[data-wt="input"]'); if (!c || !sc) return;
    const r = c.getBoundingClientRect(), b = sc.getBoundingClientRect();
    if (r.top < b.top + 40 || r.bottom > b.bottom - 60) c.scrollIntoView({ block: 'center', inline: 'nearest' });
  }
  destroy() { if (this.ro) this.ro.disconnect(); if (this._click) this.root.removeEventListener('click', this._click); this.root.innerHTML = ''; }
  noteCard(n, cls) {
    const rep = (n.replies || []).map(r => `<div class="cm-rep tone-${r.tone || 'info'}"><span class="cm-dot"></span><div>${esc(r.text)}</div></div>`).join('');
    const acts = (n.actions || []).map(a => `<button class="cm-act" data-act="${esc(a.act)}">${esc(a.label)}</button>`).join('');
    return { rep, acts };
  }
}

    const sc = this.q('.d-scroll'), avail = sc.clientWidth;
    r.classList.toggle('narrow', avail < 860 * z + 20);
    const margin = !r.classList.contains('narrow') && avail >= (816 + 300) * z + 40;

    this.qa('.cm').forEach(c => c.remove());
    if (margin) {

      col.innerHTML = this.notes.map(n => this.cardHTML(n)).join('');
      const canvas = this.q('.d-canvas'); let y = 0;
      [...col.children].forEach(card => {
        const a = this.q(`.d-content [data-bid="${card.dataset.anchor}"]`);
        const top = a ? offsetIn(a, canvas).y - 8 : y;
        const t = Math.max(top, y); card.style.top = t + 'px'; y = t + card.offsetHeight + 12;
      });
    } else {

    this.q('.d-rc').style.gap = margin ? (16 * z) + 'px' : '0px';
    this.q('.d-rc').style.paddingRight = (sc.offsetWidth - sc.clientWidth) + 'px';
    this.q('.d-wc').style.left = '16px';
  }

/* ============================================================
   App shell: setup screen, saving, keyboard, timer, menus,
   dialogs, walkthrough and the hide shortcut.
   ============================================================ */
const STORE_KEY = 'busywork:v1';
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

const $ = (s, r) => (r || document).querySelector(s);
function loadStore() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.prefs) { s.prefs = Object.assign({}, DEFAULT_PREFS, s.prefs); s.games = s.games || {}; return s; } } catch (e) { }

}
const S = loadStore();
let saveT = null;
function saveNow() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }

const A = { screen: 'setup', game: S.prefs.game, skinKind: S.prefs.skin, skin: null, state: null, hidden: false, wt: null, dialog: null, lastFlash: 0, preview: null, pick: { game: S.prefs.game, skin: S.prefs.skin } };
const medium = () => MEDIUM[A.skinKind];

function keyLabel(k) {
  k = k || S.prefs.key;
  const name = k.code.replace(/^Key/, '').replace(/^Digit/, '').replace(/^Arrow/, '').replace('Period', '.').replace('Comma', ',').replace('Slash', '/').replace('Backquote', '`').replace('Semicolon', ';').replace('Quote', "'").replace('BracketLeft', '[').replace('BracketRight', ']').replace('Backslash', '\\').replace('Minus', '-').replace('Equal', '=');

  return [k.ctrl && 'Ctrl', k.alt && 'Alt', k.shift && 'Shift', k.meta && 'Win', name].filter(Boolean).join('+');
}
const matchKey = e => { const k = S.prefs.key; return e.code === k.code && !!e.altKey === !!k.alt && !!e.ctrlKey === !!k.ctrl && !!e.shiftKey === !!k.shift && !!e.metaKey === !!k.meta; };

/* ---------- game state ---------- */
function getState(id) {
  let s = S.games[id];
  if (!s) { s = GAMES[id].init(medium()); S.games[id] = s; }
  return s;
}
function safeView() {
  const G = GAMES[A.game];
  try { return G.view(A.state, medium()); }
  catch (e) { console.warn('Resetting saved game after an error', e); A.state = S.games[A.game] = G.init(medium()); return G.view(A.state, medium()); }
}
const host = {
  prefs: () => S.prefs,
  act: a => doAct(a),
  openMenu: (name, btn) => openGameMenu(name, btn),
  openList: (items, btn) => DD.open(items, btn.getBoundingClientRect(), A.skinKind)
};

/* ---------- workspace ---------- */
function mountWorkspace() {
  const root = $('#ws');
  if (A.skin) A.skin.destroy();
  A.skin = SKINS[A.skinKind].make(root, host);
  A.skin.mount();
  setFavicon(SKIN_MINI[A.skinKind]);
  render();
}
function setFavicon(svg) {
  let l = document.querySelector('link[rel="icon"]');
  if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); }
  const imageSource = svg && svg.match(/<img[^>]+src="([^"]+)"/);
  if (imageSource) {
    const src = imageSource[1];
    // Browser tab icons need a square canvas to preserve the source proportions.
    if (A.skinKind === 'docs' || A.skinKind === 'script') {
      const art = A.skinKind === 'script'
        ? `<rect width="64" height="64" rx="10" fill="#242424"/><svg x="18" y="4" width="28" height="56" viewBox="16 10 22 44" overflow="hidden"><image href="${src}" width="144" height="66"/></svg>`
        : `<image href="${src}" x="0" y="0" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>`;
      l.href = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">${art}</svg>`);
    } else {
      l.href = src;
    }
    return;
  }
  l.href = svg ? 'data:image/svg+xml,' + encodeURIComponent(svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')) : 'data:,';
}
function render(o) {
  if (A.screen !== 'ws' || !A.skin) return;
  if (A.hidden) { const d = DECOY[A.skinKind]; A.skin.update({ title: d.title, font: d.font, size: d.size, sheetName: d.sheetName, sheetCols: d.cols, blocks: d.blocks, status: d.status }, {}); document.title = d.title; return; }

}
function afterChange(scroll) {

  saveSoon();
}
function openWorkspace() {
  A.screen = 'ws';
  $('#setup').hidden = true; $('#ws').hidden = false;
  if (A.preview) { A.preview.destroy(); A.preview = null; }
  S.prefs.started = true; S.prefs.game = A.game; S.prefs.skin = A.skinKind;
  A.state = getState(A.game);

function switchGame(id) {

function switchSkin(k) {

}
function maybeWalk() { const combo = A.game + '|' + A.skinKind; if (!S.prefs.seen[combo]) setTimeout(startWalk, 350); }
function doAct(a) {

  const G = GAMES[A.game];
  if (a.startsWith('custom:') && G.custom) { const spec = G.custom(A.state, a.slice(7)); if (spec) askNumber(spec); return; }
  if (G.act && G.act(A.state, a, medium())) afterChange(true);

function toggleHidden() {

/* ---------- menus ---------- */
const markReal = items => items.map(it => it.sep ? it : Object.assign(it, { real: true }, it.sub ? { sub: markReal(it.sub) } : {}));
function gameMenuItems() {
  if (A.hidden) return markReal([{ label: 'Resume', sc: keyLabel(), act: toggleHidden }, { sep: true }]);
  const G = GAMES[A.game];
  return markReal([
    ...(typeof G.menu === 'function' ? G.menu(A.state, medium()) : G.menu).map(function mk(m) {
      return m.sub ? { label: m.label, sub: m.sub.map(mk) } : { label: m.label, sc: m.sc, checked: m.checked, act: () => doAct(m.id) };
    }),
    { label: 'Restart this game…', act: confirmRestart },
    { sep: true },
    { label: 'Game', sub: GAME_ORDER.map(id => ({ label: GAMES[id].name, checked: id === A.game, act: () => switchGame(id) })) },
    { label: 'Workspace', sub: SKIN_ORDER.map(k => ({ label: SKINS[k].label, checked: k === A.skinKind, act: () => switchSkin(k) })) },
    { sep: true },
    { label: 'Show plain document', sc: keyLabel(), act: toggleHidden },
    { label: 'Walkthrough', act: startWalk },
    { label: 'Preferences…', act: openPrefs },
    { label: 'Start screen', act: goSetup },
    { sep: true }

}
function openGameMenu(name, btn) {
  const skin = A.skin; if (!skin) return;
  const items = (name === skin.gameMenu ? gameMenuItems() : []).concat(skin.menus[name] || []);
  btn.classList.add('open');
  DD.open(items, btn.getBoundingClientRect(), A.skinKind, () => btn.classList.remove('open'));

const DD = {
  stack: [], onClose: null,
  open(items, rect, kind, onClose) {
    this.close(); this.onClose = onClose || null; this.kind = kind;
    this.push(items, rect.left, rect.bottom + 2);
  },
  push(items, x, y) {
    const el = document.createElement('div');
    el.className = 'bw-dd dd-' + this.kind; el.setAttribute('role', 'menu');
    el.innerHTML = items.map((it, i) => it.sep ? '<div class="dd-sep"></div>' :
      `<button class="dd-i${it.sub ? ' has-sub' : ''}${it.real ? ' real' : ''}" role="menuitem" data-i="${i}"><span class="dd-ck">${it.checked ? ico('check', 16, 2) : ''}</span><span class="dd-l">${esc(it.label)}</span><span class="dd-sc">${it.sub ? '▸' : esc(it.sc || '')}</span></button>`).join('');
    document.body.appendChild(el);
    const r = el.getBoundingClientRect();
    el.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 4)) + 'px';
    el.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 4)) + 'px';
    const level = this.stack.length;
    this.stack.push({ el, items, idx: -1 });
    el.addEventListener('mousemove', e => {
      const b = e.target.closest('.dd-i'); if (!b) return;
      const i = +b.dataset.i; this.focus(level, i);
      if (items[i].sub) this.openSub(level, i); else this.trim(level + 1);
    });
    el.addEventListener('click', e => { const b = e.target.closest('.dd-i'); if (b) this.choose(level, +b.dataset.i); });
  },
  focus(level, i) {
    const m = this.stack[level]; if (!m) return; m.idx = i;
    m.el.querySelectorAll('.dd-i').forEach(b => b.classList.toggle('f', +b.dataset.i === i));
  },
  openSub(level, i) {
    const m = this.stack[level]; if (this.stack[level + 1] && this.stack[level + 1].from === i) return;
    this.trim(level + 1);
    const b = m.el.querySelector(`[data-i="${i}"]`).getBoundingClientRect();
    this.push(m.items[i].sub, b.right - 2, b.top - 6); this.stack[level + 1].from = i;
  },
  trim(n) { while (this.stack.length > n) this.stack.pop().el.remove(); },
  choose(level, i) {
    const it = this.stack[level].items[i];
    if (it.sub) { this.openSub(level, i); this.focus(level + 1, 0); return; }
    this.close(); if (it.act) it.act();
  },
  close() { this.trim(0); if (this.onClose) { const f = this.onClose; this.onClose = null; f(); } },
  get isOpen() { return this.stack.length > 0; },
  key(e) {
    const level = this.stack.length - 1, m = this.stack[level];
    const idxs = m.items.map((it, i) => it.sep ? -1 : i).filter(i => i >= 0);
    const pos = idxs.indexOf(m.idx);
    if (e.key === 'Escape') { if (level) this.trim(level); else this.close(); }
    else if (e.key === 'ArrowDown') this.focus(level, idxs[(pos + 1) % idxs.length]);
    else if (e.key === 'ArrowUp') this.focus(level, idxs[(pos - 1 + idxs.length) % idxs.length]);
    else if (e.key === 'ArrowRight' && m.idx >= 0 && m.items[m.idx].sub) { this.openSub(level, m.idx); this.focus(level + 1, 0); }
    else if (e.key === 'ArrowLeft' && level) this.trim(level);
    else if (e.key === 'Enter' || e.key === ' ') { if (m.idx >= 0) this.choose(level, m.idx); }
    else return;
    e.preventDefault();
  }
};
document.addEventListener('mousedown', e => { if (DD.isOpen && !e.target.closest('.bw-dd') && !e.target.closest('[data-menu]') && !e.target.closest('[data-zoom]')) DD.close(); });

/* ---------- dialogs ---------- */
function openDialog(title, body, buttons, onMount) {

  m.className = 'bw-modal dlg-' + (A.screen === 'ws' ? A.skinKind : 'setup');
  m.innerHTML = `<div class="bw-dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="bw-db">${body}</div><div class="bw-dbtns">${buttons.map((b, i) => `<button class="bw-btn${b.primary ? ' primary' : ''}" data-b="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-b]'); if (b) { const f = buttons[+b.dataset.b].act; if (f) f(); else closeDialog(); return; }
    if (e.target === m) closeDialog();

function closeDialog() { if (A.dialog) { A.dialog.remove(); A.dialog = null; A.recording = false; } }

    { label: 'Cancel' },

function askNumber(spec) {

    closeDialog(); doAct(spec.act + v);
  };
  openDialog(spec.title, `
    <div class="pf-row"><div><div class="pf-l">${esc(spec.label)}</div><div class="pf-d">A whole number from ${spec.min} to ${spec.max}.</div></div><input id="pf-num" type="number" inputmode="numeric" min="${spec.min}" max="${spec.max}" step="1" value="${esc(spec.value)}"></div>
    <div class="pf-hint" id="pf-numhint" hidden>Enter a whole number from ${spec.min} to ${spec.max}.</div>`,
    [{ label: 'Cancel' }, { label: 'Apply', primary: true, act: apply }],
    m => {
      const inp = $('#pf-num', m);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); apply(); } });
      setTimeout(() => { inp.focus(); inp.select(); });
    });
}
function openPrefs() {
  const p = S.prefs;
  openDialog('Preferences', `
    <div class="pf-row"><div><div class="pf-l">Hide shortcut</div><div class="pf-d">Swaps the game for an ordinary document and pauses the timer. Press it again to come back.</div></div><button class="pf-key" id="pf-key">${esc(keyLabel())}</button></div>
    <div class="pf-hint" id="pf-hint" hidden></div>
    <div class="pf-row"><div><div class="pf-l">Show timer</div><div class="pf-d">Display the round timer in the status area.</div></div><input type="checkbox" id="pf-timer" ${p.timer ? 'checked' : ''}></div>
    <div class="pf-row"><div><div class="pf-l">Profile initial</div><div class="pf-d">The letter in the round badge at the top right.</div></div><input id="pf-init" maxlength="1" value="${esc(p.initial)}"></div>
    <div class="pf-row"><div><div class="pf-l">Saved progress</div><div class="pf-d">Scores and games in progress for every game, stored in this browser.</div></div><button class="bw-btn" id="pf-reset">Reset…</button></div>
    <div class="pf-confirm" id="pf-confirm" hidden><span>Erase all scores and saved games?</span><button class="bw-btn" id="pf-no">Cancel</button><button class="bw-btn primary" id="pf-yes">Erase</button></div>`,
    [{ label: 'Done', primary: true, act: () => { closeDialog(); render(); } }],
    m => {
      $('#pf-key', m).onclick = () => { A.recording = true; $('#pf-key', m).textContent = 'Press keys…'; $('#pf-key', m).classList.add('rec'); };
      $('#pf-timer', m).onchange = e => { S.prefs.timer = e.target.checked; saveSoon(); if (A.skin) A.skin.setStatus(A.skin.view.status); };
      $('#pf-init', m).oninput = e => { const v = e.target.value.trim(); if (v) { S.prefs.initial = v.toUpperCase(); saveSoon(); } };
      $('#pf-reset', m).onclick = () => { $('#pf-confirm', m).hidden = false; };
      $('#pf-no', m).onclick = () => { $('#pf-confirm', m).hidden = true; };
      $('#pf-yes', m).onclick = () => { S.games = {}; A.state = getState(A.game); A.lastFlash = 0; saveNow(); $('#pf-confirm', m).hidden = true; $('#pf-reset', m).textContent = 'Erased'; render(); };
    });
}
function recordKey(e) {
  e.preventDefault();
  const btn = $('#pf-key'), hint = $('#pf-hint');
  if (e.key === 'Escape') { A.recording = false; btn.textContent = keyLabel(); btn.classList.remove('rec'); return; }
  if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(e.key)) return;
  const fkey = /^F\d+$/.test(e.code);
  if (!fkey && !e.ctrlKey && !e.altKey && !e.metaKey) { hint.hidden = false; hint.textContent = 'Include Ctrl, Alt/Option or ⌘ so the shortcut never clashes with typing.'; return; }
  S.prefs.key = { code: e.code, alt: e.altKey, ctrl: e.ctrlKey, shift: e.shiftKey, meta: e.metaKey };
  A.recording = false; hint.hidden = true; btn.textContent = keyLabel(); btn.classList.remove('rec'); saveSoon();
}

/* ---------- walkthrough ---------- */
function startWalk() {
  if (A.hidden || A.screen !== 'ws') return;
  DD.close(); endWalk(true);
  const w = GAMES[A.game].walk[medium()], info = SKIN_INFO[A.skinKind];
  const steps = [
    { role: 'prompt', title: 'The prompt', body: w[0] },
    { role: 'input', title: 'Where you answer', body: w[1] },
    { role: 'feedback', title: 'How you will know', body: w[2] },
    { role: 'status', title: 'Score, tries and timer', body: info.status },
    { role: 'menu', title: 'Controls and the hide key', body: `${info.menu} Press ${keyLabel()} at any time to swap in a plain document and pause the timer; press it again to come back. Progress saves in this browser.` }
  ];
  A.wt = { steps, i: 0 };
  const shield = document.createElement('div'); shield.className = 'bw-wt-shield'; document.body.appendChild(shield);
  const ring = document.createElement('div'); ring.className = 'bw-wt-ring wt-' + A.skinKind; document.body.appendChild(ring);
  const card = document.createElement('div'); card.className = 'bw-wt-card'; card.setAttribute('role', 'dialog'); document.body.appendChild(card);
  A.wt.els = { shield, ring, card };
  card.addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (!b) return; if (b.dataset.w === 'next') walkStep(1); else if (b.dataset.w === 'back') walkStep(-1); else endWalk(); });
  showWalk();
}
function walkStep(d) { if (!A.wt) return; A.wt.i += d; if (A.wt.i >= A.wt.steps.length) return endWalk(); if (A.wt.i < 0) A.wt.i = 0; showWalk(); }
function showWalk() {
  const W = A.wt, st = W.steps[W.i];
  const el = A.skin.root.querySelector(`[data-wt="${st.role}"]`);
  if (!el) { if (W.i < W.steps.length - 1) { W.i++; return showWalk(); } return endWalk(); }
  el.scrollIntoView({ block: 'center', inline: 'nearest' });
  const { ring, card } = W.els, n = W.steps.length;
  card.innerHTML = `<div class="wt-step">${W.i === 0 ? 'Quick tour · ' : ''}${W.i + 1} of ${n}</div><div class="wt-title">${esc(st.title)}</div><div class="wt-body">${esc(st.body)}</div>
    <div class="wt-btns"><button class="wt-skip" data-w="end">${W.i === n - 1 ? '' : 'Skip tour'}</button>${W.i ? '<button class="wt-back" data-w="back">Back</button>' : ''}<button class="wt-next" data-w="next">${W.i === n - 1 ? 'Start playing' : 'Next'}</button></div>`;
  requestAnimationFrame(() => {
    const r = el.getBoundingClientRect(), pad = 4;
    Object.assign(ring.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
    const cw = card.offsetWidth, chh = card.offsetHeight, m = 12;
    let x, y;
    if (r.bottom + m + chh < innerHeight - 8) { y = r.bottom + m; x = r.left; }
    else if (r.top - m - chh > 8) { y = r.top - m - chh; x = r.left; }
    else if (r.right + m + cw < innerWidth - 8) { x = r.right + m; y = Math.max(8, r.top); }
    else { x = Math.max(8, r.left - m - cw); y = Math.max(8, r.top); }
    card.style.left = Math.max(8, Math.min(x, innerWidth - cw - 8)) + 'px';
    card.style.top = Math.max(8, Math.min(y, innerHeight - chh - 8)) + 'px';
    const nb = card.querySelector('.wt-next'); if (nb) nb.focus();
  });
}
function endWalk(silent) {
  if (!A.wt) return;
  Object.values(A.wt.els).forEach(e => e.remove());
  A.wt = null;
  if (!silent) { S.prefs.seen[A.game + '|' + A.skinKind] = true; saveSoon(); }
  else S.prefs.seen[A.game + '|' + A.skinKind] = true;
}

/* ---------- keyboard ---------- */
function normKey(e) {
  const plain = e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey;
  return { key: e.key, code: e.code, ctrl: e.ctrlKey, meta: e.metaKey, alt: e.altKey, shift: e.shiftKey, repeat: e.repeat, ch: plain ? e.key : null };
}
window.addEventListener('keydown', e => {
  if (A.recording) return recordKey(e);
  if (A.screen === 'ws' && matchKey(e)) { e.preventDefault(); toggleHidden(); return; }
  if (DD.isOpen) { DD.key(e); return; }
  if (A.dialog) { if (e.key === 'Escape') closeDialog(); return; }
  if (A.wt) {
    if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); walkStep(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); walkStep(-1); }
    else if (e.key === 'Escape') endWalk();
    return;
  }
  if (A.screen === 'setup') { if (e.key === 'Enter' && !e.target.closest('button')) { e.preventDefault(); A.game = A.pick.game; A.skinKind = A.pick.skin; openWorkspace(); } return; }
  if (A.screen !== 'ws' || e.isComposing || e.keyCode === 229) return;
  if ((e.altKey || e.ctrlKey) && e.code === 'Slash') { e.preventDefault(); const b = A.skin.root.querySelector('[data-wt="menu"]'); if (b) openGameMenu(b.dataset.menu, b); return; }
  if (A.hidden || (A.skin.blocksInput && A.skin.blocksInput())) return;
  const k = normKey(e);
  if ((k.ctrl || k.meta) && k.key !== 'Backspace') return;
  if (k.meta && k.key === 'Backspace') k.alt = true;
  const handled = GAMES[A.game].key(A.state, k, medium());
  if (handled) { e.preventDefault(); afterChange(true); }
  else if (A.skin.navKey && A.skin.navKey(k)) e.preventDefault();
});
/* touch keyboards: a hidden field receives text when tapped */
const kb = $('#kb');
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' || A.screen !== 'ws' || A.hidden) return;
  if (e.target.closest('.d-scroll, .c-scroll, .s-gridwrap')) setTimeout(() => kb.focus({ preventScroll: true }), 0);
});
kb.addEventListener('input', e => {
  if (A.screen !== 'ws' || A.hidden) { kb.value = ''; return; }
  const G = GAMES[A.game], send = k => G.key(A.state, k, medium());
  if (e.inputType === 'deleteContentBackward') send({ key: 'Backspace' });
  else if (e.inputType === 'insertLineBreak') send({ key: 'Enter' });
  else for (const ch of (e.data || kb.value)) send(ch === '\n' ? { key: 'Enter' } : { key: ch, ch });
  kb.value = ''; afterChange(true);
});

/* ---------- drawing input (figures that take clicks and drags) ---------- */
let figDrag = null, figRaf = 0;
function svgPoint(svg, e) {
  const m = svg.getScreenCTM(); if (!m) return { x: 0, y: 0 };
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  return { x: p.x, y: p.y };
}
function figEvent(type, e) {
  if (!figDrag) return;
  const svg = A.skin && A.skin.root.querySelector(`svg[data-fig="${figDrag}"]`);
  const G = GAMES[A.game]; if (!svg || !G.pointer) return;
  const pt = svgPoint(svg, e);
  if (G.pointer(A.state, { type, x: pt.x, y: pt.y }, medium())) {
    if (type === 'move') { if (!figRaf) figRaf = requestAnimationFrame(() => { figRaf = 0; render(); }); }
    else afterChange(false);
  }
}
document.addEventListener('pointerdown', e => {
  if (A.screen !== 'ws' || A.hidden || A.wt || A.dialog || DD.isOpen) return;
  const svg = e.target.closest && e.target.closest('svg[data-fig]');
  if (!svg || !A.skin || !A.skin.root.contains(svg) || !GAMES[A.game].pointer) return;
  e.preventDefault();
  figDrag = svg.dataset.fig;
  figEvent('down', e);
});
window.addEventListener('pointermove', e => { if (figDrag) figEvent('move', e); });
window.addEventListener('pointerup', e => { if (figDrag) { figEvent('up', e); figDrag = null; } });
window.addEventListener('pointercancel', () => { figDrag = null; });

/* ---------- timer ---------- */
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(), dt = Math.min(now - lastTick, 1000); lastTick = now;
  if (A.screen !== 'ws' || A.hidden || A.wt || A.dialog || document.hidden || !A.state) return;
  const G = GAMES[A.game]; if (!G.running(A.state)) return;
  const clk = s => Math.floor((G.clockMs ? G.clockMs(s) : s.ms) / 1000);
  const before = clk(A.state); A.state.ms += dt;
  if (G.tick && G.tick(A.state, dt)) { afterChange(false); return; }
  if (clk(A.state) !== before) { A.skin.setStatus(G.status(A.state)); saveSoon(); }
}, 200);
document.addEventListener('visibilitychange', () => { lastTick = performance.now(); if (document.hidden) saveNow(); });
window.addEventListener('pagehide', saveNow);
window.addEventListener('resize', () => { DD.close(); if (A.wt) showWalk(); });

/* ---------- setup screen ---------- */
const SKIN_MINI = {
  docs: LOGOS.docs,
  sheets: LOGOS.sheets,
  script: LOGOS.script
};
function renderSetup() {
  const el = $('#setup');
  const gameCard = id => {
    const G = GAMES[id], s = S.games[id], meta = s ? G.summary(s) : '';
    return `<label class="su-card"><input type="radio" name="su-game" value="${id}" ${A.pick.game === id ? 'checked' : ''}><span class="su-cn">${esc(G.name)}</span><span class="su-cd">${esc(G.blurb)}</span><span class="su-cm">${esc(G.inspo)}${meta ? ` · <b>${esc(meta)}</b>` : ''}</span></label>`;
  };
  const skinCard = k => `<label class="su-card su-wcard"><input type="radio" name="su-skin" value="${k}" ${A.pick.skin === k ? 'checked' : ''}><span class="su-wi">${SKIN_MINI[k]}</span><span class="su-cn">${SKINS[k].label}</span><span class="su-cd">${esc(SKINS[k].desc)}</span></label>`;
  el.innerHTML = `
<div class="su">
  <header class="su-top"><div class="su-mark">Busy<span>work</span></div><p class="su-tag">Small games inside ordinary-looking work. Pick a game and a workspace; any game runs in any workspace.</p></header>
  <div class="su-grid">
    <section class="su-pick" aria-label="Game">
      <fieldset><legend class="su-lbl">1 · Game</legend><div class="su-list">${GAME_ORDER.map(gameCard).join('')}</div></fieldset>
    </section>
    <section class="su-prev" aria-label="Workspace and preview">
      <fieldset><legend class="su-lbl">2 · Workspace</legend><div class="su-list su-ws">${SKIN_ORDER.map(skinCard).join('')}</div></fieldset>
      <div class="su-lbl su-pl">Preview</div>
      <div class="su-frame"><div class="su-scale"><div class="ws" id="su-pv"></div></div></div>
      <div class="su-bar">
        <div class="su-cap"></div>
        <button class="su-open" id="su-open">Open workspace</button>
      </div>
      <ul class="su-notes">
        <li>Press <kbd>${esc(keyLabel())}</kbd> at any time to swap the game for a plain document and pause the timer. Press it again to return.</li>
        <li>Game controls live in the workspace's <b>Tools</b> menu (<b>View</b> in the screenplay). You can switch workspace mid-game without losing progress.</li>
        <li>Progress and preferences save in this browser only. Survey counts and rarity ratings are fictional sample data.</li>
      </ul>
    </section>
  </div>
</div>`;
  el.querySelectorAll('input[name="su-game"]').forEach(r => r.onchange = () => { A.pick.game = r.value; updatePreview(); });
  el.querySelectorAll('input[name="su-skin"]').forEach(r => r.onchange = () => { A.pick.skin = r.value; updatePreview(true); });
  $('#su-open').onclick = () => { A.game = A.pick.game; A.skinKind = A.pick.skin; openWorkspace(); };
  updatePreview(true);
  if (!A.ro) { A.ro = new ResizeObserver(scalePreview); }
  A.ro.observe($('.su-frame'));
}
function updatePreview(remount) {
  const pv = $('#su-pv'); if (!pv) return;
  if (remount || !A.preview || A.preview.kind !== A.pick.skin) {
    if (A.preview) A.preview.destroy();
    A.preview = SKINS[A.pick.skin].make(pv, host, { preview: true }); A.preview.mount();
  }
  const G = GAMES[A.pick.game], m = MEDIUM[A.pick.skin];
  let st = S.games[A.pick.game];
  try { A.preview.update(G.view(st || G.init(m), m), {}); } catch (e) { A.preview.update(G.view(G.init(m), m), {}); }
  A.preview.layout();
  $('.su-cap').innerHTML = `<b>${esc(G.name)}</b> in a <b>${esc(SKINS[A.pick.skin].label.toLowerCase())}</b>${st ? `<span>${esc(G.summary(st) || 'In progress')}</span>` : '<span>New game</span>'}`;
  scalePreview();
}
function scalePreview() {
  const f = $('.su-frame'); if (!f) return;
  const s = f.clientWidth / 1280;
  $('.su-scale').style.transform = `scale(${s})`;
  f.style.height = Math.round(800 * s) + 'px';
}

/* ---------- boot ---------- */
(function boot() {
  if (S.prefs.started && GAMES[S.prefs.game] && SKINS[S.prefs.skin]) { A.game = S.prefs.game; A.skinKind = S.prefs.skin; openWorkspace(); }
  else { A.screen = 'setup'; $('#setup').hidden = false; renderSetup(); }
})();

</script>
</body>
</html>
